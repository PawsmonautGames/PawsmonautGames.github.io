# Studio news shown on the home page, newest first.
- date: 2026-10-20
  title: AETHUS is coming to PS5, Xbox Series X|S, Nintendo Switch 2 and Microsoft Store in early 2027
  body: >-
    We've partnered with Making Port to bring AETHUS to consoles. Making Port is developing the console
    versions and publishing them on every platform, with reworked gamepad controls, Joy-Con 2 mouse
    controls on Switch 2, a version tailored for Xbox Ally, visual improvements, and French, German and
    Spanish localisation. A release date will be announced soon.
