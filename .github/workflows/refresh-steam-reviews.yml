name: Refresh Steam review scores

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-steam-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh review scores from the Steam store pages
        run: node .github/scripts/refresh-steam-reviews.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- _posts; then
            echo "Review scores are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Refresh Steam review scores"
          git push
